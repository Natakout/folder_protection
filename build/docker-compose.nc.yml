#
# Disposable Nextcloud instance for checking Folder Protection against one
# specific version out of the range it declares in appinfo/info.xml. MariaDB
# and Redis like the NC 34 rig this replaces: ProtectionChecker caches through
# ICacheFactory::createDistributed(), and without a distributed backend that
# falls back to APCu, which the CLI and Apache do not share -- a protection
# added by `occ` would then look like it does nothing for up to 300 seconds
# and the integration suite would fail for a reason that has nothing to do with
# the Nextcloud version under test. See build/README.md.
#
# Not meant to be brought up by hand: NC_VERSION and NC_PORT must be set in the
# environment, which build/nc-instance.sh does. Each version gets its own
# project name, so several can run side by side.
services:
  db:
    image: mariadb:10.11
    container_name: folderprot-nc${NC_VERSION}-db
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    volumes:
      - db:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=nextcloud
      - MYSQL_PASSWORD=nextcloud
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud

  redis:
    image: redis:alpine
    container_name: folderprot-nc${NC_VERSION}-redis
    restart: unless-stopped

  app:
    image: nextcloud:${NC_VERSION}-apache
    container_name: folderprot-nc${NC_VERSION}-app
    restart: unless-stopped
    ports:
      - "${NC_PORT}:80"
    depends_on:
      - db
      - redis
    volumes:
      - nextcloud:/var/www/html
      # Only this app. groupfolders (which the integration suite needs) is
      # installed from the App Store by nc-instance.sh, so each Nextcloud
      # version gets the release built for it rather than whatever copy sits in
      # a shared apps/ directory.
      - ..:/var/www/html/custom_apps/folder_protection
      # The app's own info.xml with its <nextcloud> range widened to this exact
      # version (generated by nc-instance.sh). Nextcloud refuses to enable an
      # app outside its declared range, and `occ app:enable --force` only waives
      # max-version, never min-version -- so without this, a version below the
      # declared minimum could not be tested at all. The file in the repo is
      # left alone; only this container sees the widened copy.
      - ${INFO_XML}:/var/www/html/custom_apps/folder_protection/appinfo/info.xml:ro
    environment:
      - MYSQL_HOST=db
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=nextcloud
      - REDIS_HOST=redis
      - NEXTCLOUD_ADMIN_USER=ncadmin
      - NEXTCLOUD_ADMIN_PASSWORD=folderprot-nc${NC_VERSION}-verify
      - NEXTCLOUD_TRUSTED_DOMAINS=localhost

volumes:
  # Compose does not interpolate variables inside mapping keys, only in values
  # -- these keys must stay fixed. They don't collide between versions because
  # `docker compose -p folderprot-ncNN` prefixes them with the project name.
  db:
  nextcloud:
